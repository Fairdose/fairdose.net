on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-18.04
    steps:
      - name: Get repository
        uses: actions/checkout@v2

      - name: Use Node.js 14.18
        uses: actions/setup-node@v2
        with:
          node-version: '14.18'

      - name: Build Project
        run: |
          npm install
          npm run build

      - name: SFTP Sync
        uses: wlixcc/SFTP-Deploy-Action@v1.2.1
        with:
          username: fairdose_github
          server: fairdose.net
          ssh_private_key: ${{ secrets.dev_fairdose_ssh }}
          local_path: ./.dist
          remote_path: /var/www/fairdose_net
